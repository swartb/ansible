---
- name: Zorg dat managed groups bestaan
  ansible.builtin.group:
    name: "{{ item.name }}"
    system: "{{ item.system | default(false) }}"
    state: present
  loop: "{{ managed_groups }}"

- name: Zorg dat managed users bestaan
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    append: true
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ managed_users }}"

- name: Configureer passwordless sudo voor managed users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ managed_users }}"
  when:
    - item.passwordless_sudo | default(false)

- name: Verwijder passwordless sudo file als uitgeschakeld
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ managed_users }}"
  when:
    - not (item.passwordless_sudo | default(false))

- name: Zorg dat .ssh directory bestaat voor managed users met authorized_keys
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ managed_users }}"
  when:
    - item.authorized_keys is defined
    - item.authorized_keys | length > 0
    - item.name != 'root'

- name: Zorg dat .ssh directory bestaat voor root met authorized_keys
  ansible.builtin.file:
    path: "/root/.ssh"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ managed_users }}"
  when:
    - item.authorized_keys is defined
    - item.authorized_keys | length > 0
    - item.name == 'root'

- name: Plaats authorized keys voor managed users
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ lookup('file', ssh_public_keys_base_path ~ '/' ~ item.1.file) }}"
    state: present
  loop: "{{ managed_users | subelements('authorized_keys', skip_missing=True) }}"
  no_log: true