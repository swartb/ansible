---
managed_groups:
  - name: admin
    system: false

managed_users:
  - name: bart
    comment: Bart
    groups:
      - sudo
      - admin
    shell: /bin/bash
    create_home: true
    state: present
    authorized_keys:
      - file: files/ssh/bart_id_ed25519.pub

  - name: hermes
    comment: hermes-agent
    groups:
      - sudo
      - admin
    shell: /bin/bash
    create_home: true
    authorized_keys:
      -file: files/ssh/ansible_management_ed25519.pub
      
       